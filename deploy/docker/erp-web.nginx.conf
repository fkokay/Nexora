server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Revalidate the app shell so deployments pick up newly fingerprinted bundles.
    location = /index.html {
        expires -1;
    }

    # Vite writes fingerprinted production assets below /assets/.
    location ^~ /assets/ {
        expires 1y;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://nexorastudio.ozgurteknolojiyazilim.com" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        client_max_body_size 8m;
        proxy_pass http://platform-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /studio/ {
        proxy_pass http://ai-service:8080/studio/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 135s;
        proxy_send_timeout 135s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://platform-api:8080/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
