global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: aierp-platform-api
    metrics_path: /metrics
    static_configs:
      - targets: [platform-api:8080]
  - job_name: aierp-ai-service
    metrics_path: /metrics
    static_configs:
      - targets: [ai-service:8080]
  - job_name: aierp-release-deployer
    metrics_path: /metrics
    static_configs:
      - targets: [release-deployer:8080]
