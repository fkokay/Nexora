services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - aierp-sql-data:/var/opt/mssql
      - aierp-production-backups:/var/opt/mssql/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  platform-api:
    build:
      context: ../..
      dockerfile: deploy/docker/Platform.Api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Platform: Server=sqlserver,1433;Database=AIERPPlatform;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Database__SeparationEnabled: ${DATABASE_SEPARATION_ENABLED:-false}
      Database__SeparationBackupPath: ${DATABASE_SEPARATION_BACKUP_PATH:-}
      Authentication__SigningKey: ${AUTH_SIGNING_KEY:?Set AUTH_SIGNING_KEY in .env}
      PluginHost__SigningKey: ${PLUGIN_HOST_SIGNING_KEY:?Set PLUGIN_HOST_SIGNING_KEY in .env}
      PluginHost__Issuer: AIERP
      Database__ApplyMigrationsOnStartup: "true"
      ModulePackages__RootPath: /module-packages
      PluginHost__BaseUrl: http://plugin-host:8080
      IntegrationHost__SigningKey: ${PLUGIN_HOST_SIGNING_KEY:?Set PLUGIN_HOST_SIGNING_KEY in .env}
      IntegrationHost__BaseUrl: http://integration-host:8080
      IntegrationQueue__EncryptionKey: ${INTEGRATION_QUEUE_ENCRYPTION_KEY:?Set INTEGRATION_QUEUE_ENCRYPTION_KEY in .env}
      AI__SettingsEncryptionKey: ${AI_SETTINGS_ENCRYPTION_KEY:-}
      Bootstrap__Email: ${BOOTSTRAP_EMAIL:-}
      Platform__SuperAdminEmail: ${PLATFORM_SUPER_ADMIN_EMAIL:-}
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD:-}
      Bootstrap__DisplayName: ${BOOTSTRAP_DISPLAY_NAME:-Platform Admin}
      Bootstrap__TenantName: ${BOOTSTRAP_TENANT_NAME:-Nexora Demo}
      Frontend__Origins__0: http://localhost:5173
      Frontend__Origins__1: http://localhost:5174
      Frontend__Origins__2: http://localhost:5175
      Frontend__Origins__3: ${PUBLIC_INGRESS_ORIGIN:-http://localhost:5174}
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - aierp-module-packages:/module-packages
    networks:
      - default
      - monitoring
      - plugin-runtime
      - integration-runtime
    depends_on:
      sqlserver:
        condition: service_healthy
      plugin-host:
        condition: service_healthy
      integration-host:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  plugin-host:
    build:
      context: ../..
      dockerfile: deploy/docker/PluginHost.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      PluginHost__SigningKey: ${PLUGIN_HOST_SIGNING_KEY:?Set PLUGIN_HOST_SIGNING_KEY in .env}
      PluginHost__Issuer: AIERP
      PluginHost__Audience: AIERP.PluginHost
      ModulePackages__RootPath: /module-packages
    volumes:
      - aierp-module-packages:/module-packages:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    user: "1654:1654"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 64
    networks:
      - plugin-runtime
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  integration-host:
    build:
      context: ../..
      dockerfile: deploy/docker/IntegrationHost.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      IntegrationHost__SigningKey: ${PLUGIN_HOST_SIGNING_KEY:?Set PLUGIN_HOST_SIGNING_KEY in .env}
      IntegrationHost__Issuer: AIERP
      IntegrationHost__Audience: AIERP.IntegrationHost
      IntegrationSecrets__RootPath: /run/integration-secrets
    volumes:
      - ./integration-secrets:/run/integration-secrets:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    user: "1654:1654"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 64
    networks:
      - integration-runtime
      - integration-egress
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  ai-service:
    build:
      context: ../..
      dockerfile: deploy/docker/AIService.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Platform: Server=sqlserver,1433;Database=AIERPPlatform;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Database__SeparationEnabled: ${DATABASE_SEPARATION_ENABLED:-false}
      StudioKnowledge__RetentionDays: ${STUDIO_KNOWLEDGE_RETENTION_DAYS:-180}
      Authentication__SigningKey: ${AUTH_SIGNING_KEY:?Set AUTH_SIGNING_KEY in .env}
      Frontend__Origins__0: http://localhost:5173
      Frontend__Origins__1: http://localhost:5174
      Frontend__Origins__2: http://localhost:5175
      Frontend__Origins__3: ${PUBLIC_INGRESS_ORIGIN:-http://localhost:5174}
      WorkspaceRunner__BaseUrl: http://workspace-runner:8080
      ReleaseDeployer__BaseUrl: http://release-deployer:8080
      AI__OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      AI__OpenAI__Model: ${OPENAI_MODEL:-gpt-6-astra}
      AI__OpenAI__EmbeddingModel: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI__Provider: ${AI_PROVIDER:-OpenAI}
      AI__SettingsEncryptionKey: ${AI_SETTINGS_ENCRYPTION_KEY:-}
      AI__Nvidia__ApiKey: ${NVIDIA_API_KEY:-}
      AI__Nvidia__Model: ${NVIDIA_MODEL:-}
      GitHub__AppId: ${GITHUB_APP_ID:-}
      GitHub__PrivateKeyPem: ${GITHUB_APP_PRIVATE_KEY_PEM:-}
      GitHub__AppSlug: ${GITHUB_APP_SLUG:-}
      GitHub__SetupCallbackUrl: ${GITHUB_APP_SETUP_CALLBACK_URL:-http://localhost:5081/studio/github/setup-callback}
      GitHub__StudioRedirectUrl: ${GITHUB_STUDIO_REDIRECT_URL:-http://localhost:5174/?app=studio}
    ports:
      - "127.0.0.1:5081:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      platform-api:
        condition: service_healthy
      workspace-runner:
        condition: service_healthy
      release-deployer:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - default
      - studio-internal
      - monitoring

  development-studio:
    build:
      context: ../..
      dockerfile: deploy/docker/DevelopmentStudio.Dockerfile
    ports:
      - "127.0.0.1:5174:80"
    networks:
      - default
      - public-ingress
    depends_on:
      platform-api:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  public-ingress:
    image: caddy:2.11.7-alpine
    profiles: [public-ingress]
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      development-studio:
        condition: service_healthy
    networks:
      - public-ingress
    restart: unless-stopped

  offsite-backup:
    image: rclone/rclone:1.75.2
    profiles: [offsite-backup]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        test -n "$${OFFSITE_BACKUP_BUCKET}";
        test -n "$${RCLONE_CONFIG_REMOTE_ENDPOINT}";
        test -n "$${RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID}";
        test -n "$${RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY}";
        test -n "$${RCLONE_CONFIG_CRYPT_PASSWORD}";
        case "$${BACKUP_SYNC_INTERVAL_SECONDS}" in ''|*[!0-9]*|0) echo 'BACKUP_SYNC_INTERVAL_SECONDS must be a positive integer' >&2; exit 1;; esac;
        while :; do
          rclone copy /production-backups crypt: --config /dev/null --exclude '*.partial' --log-level INFO;
          rclone check /production-backups crypt: --config /dev/null --exclude '*.partial' --download --log-level INFO;
          sleep "$${BACKUP_SYNC_INTERVAL_SECONDS}";
        done
    environment:
      OFFSITE_BACKUP_BUCKET: ${OFFSITE_BACKUP_BUCKET:-}
      RCLONE_CONFIG_REMOTE_TYPE: s3
      RCLONE_CONFIG_REMOTE_PROVIDER: ${OFFSITE_BACKUP_PROVIDER:-Other}
      RCLONE_CONFIG_REMOTE_ENDPOINT: ${OFFSITE_BACKUP_ENDPOINT:-}
      RCLONE_CONFIG_REMOTE_REGION: ${OFFSITE_BACKUP_REGION:-us-east-1}
      RCLONE_CONFIG_REMOTE_ENV_AUTH: "false"
      RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID: ${OFFSITE_BACKUP_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY: ${OFFSITE_BACKUP_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_CRYPT_TYPE: crypt
      RCLONE_CONFIG_CRYPT_REMOTE: remote:${OFFSITE_BACKUP_BUCKET:-}/${OFFSITE_BACKUP_PREFIX:-nexora}
      RCLONE_CONFIG_CRYPT_PASSWORD: ${OFFSITE_BACKUP_CRYPT_PASSWORD_OBSCURED:-}
      BACKUP_SYNC_INTERVAL_SECONDS: ${OFFSITE_BACKUP_SYNC_INTERVAL_SECONDS:-900}
    volumes:
      - aierp-production-backups:/production-backups:ro
    networks:
      - offsite-egress
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5

  offsite-restore:
    image: rclone/rclone:1.75.2
    profiles: [offsite-backup]
    entrypoint: ["rclone"]
    command: ["--version"]
    environment:
      RCLONE_CONFIG_REMOTE_TYPE: s3
      RCLONE_CONFIG_REMOTE_PROVIDER: ${OFFSITE_BACKUP_PROVIDER:-Other}
      RCLONE_CONFIG_REMOTE_ENDPOINT: ${OFFSITE_BACKUP_ENDPOINT:-}
      RCLONE_CONFIG_REMOTE_REGION: ${OFFSITE_BACKUP_REGION:-us-east-1}
      RCLONE_CONFIG_REMOTE_ENV_AUTH: "false"
      RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID: ${OFFSITE_BACKUP_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY: ${OFFSITE_BACKUP_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_CRYPT_TYPE: crypt
      RCLONE_CONFIG_CRYPT_REMOTE: remote:${OFFSITE_BACKUP_BUCKET:-}/${OFFSITE_BACKUP_PREFIX:-nexora}
      RCLONE_CONFIG_CRYPT_PASSWORD: ${OFFSITE_BACKUP_CRYPT_PASSWORD_OBSCURED:-}
    volumes:
      - aierp-production-backups:/production-backups
    networks:
      - offsite-egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5

  persistent-volume-archive:
    build:
      context: ../..
      dockerfile: deploy/docker/PersistentVolumeArchive.Dockerfile
    profiles: [volume-backup]
    environment:
      PERSISTENT_VOLUME_MODE: ${PERSISTENT_VOLUME_MODE:-backup}
      PERSISTENT_VOLUME_ARCHIVE: ${PERSISTENT_VOLUME_ARCHIVE:-}
      VOLUME_BACKUP_RETENTION_DAYS: ${VOLUME_BACKUP_RETENTION_DAYS:-30}
    volumes:
      - aierp-workspaces:/volumes/workspaces
      - aierp-test-jobs:/volumes/test-jobs
      - aierp-release-packages:/volumes/release-packages
      - aierp-staging-releases:/volumes/staging-releases
      - aierp-production-releases:/volumes/production-releases
      - aierp-module-packages:/volumes/module-packages
      - caddy-data:/volumes/caddy-data
      - caddy-config:/volumes/caddy-config
      - aierp-production-backups:/backups
    network_mode: none
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, DAC_READ_SEARCH, CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0

  workspace-runner:
    build:
      context: ../..
      dockerfile: deploy/docker/WorkspaceRunner.Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      Authentication__SigningKey: ${AUTH_SIGNING_KEY:?Set AUTH_SIGNING_KEY in .env}
      Authentication__Issuer: AIERP
      Authentication__Audience: AIERP.WorkspaceRunner
      Workspace__RootPath: /workspaces
      Workspace__AllowedGitHosts__0: ${WORKSPACE_ALLOWED_GIT_HOST:-github.com}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /home/app:rw,noexec,nosuid,size=16m,uid=1654,gid=1654,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    volumes:
      - aierp-workspaces:/workspaces
      - aierp-test-jobs:/test-jobs
      - aierp-release-packages:/release-packages
    networks:
      - studio-internal
    restart: unless-stopped

  release-deployer:
    build:
      context: ../..
      dockerfile: deploy/docker/ReleaseDeployer.Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      Authentication__SigningKey: ${AUTH_SIGNING_KEY:?Set AUTH_SIGNING_KEY in .env}
      Authentication__Issuer: AIERP
      Authentication__Audience: AIERP.ReleaseDeployer
      Database__SeparationEnabled: ${DATABASE_SEPARATION_ENABLED:-false}
      ReleaseDeployer__PackageRoot: /release-packages
      ReleaseDeployer__ReleaseRoot: /staging-releases
      ReleaseDeployer__ProductionRoot: /production-releases
      ReleaseDeployer__LockRoot: /deployer-state
      ReleaseDeployer__MaxActiveStagingProjects: "2"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - aierp-release-packages:/release-packages:ro
      - aierp-staging-releases:/staging-releases
      - aierp-production-releases:/production-releases
      - aierp-production-backups:/production-backups
      - aierp-deployer-state:/deployer-state
    networks:
      - studio-internal
      - monitoring
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - aierp-prometheus-data:/prometheus
    networks:
      - monitoring
      - monitoring-ui
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0

  workspace-sandbox:
    build:
      context: ../..
      dockerfile: deploy/docker/WorkspaceSandbox.Dockerfile
    environment:
      WorkspaceSandbox__JobRoot: /test-jobs
      WorkspaceSandbox__TempRoot: /tmp/test-jobs
    depends_on:
      workspace-runner:
        condition: service_started
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp/test-jobs:rw,exec,nosuid,nodev,size=2g
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - KILL
      - CHOWN
      - SETPCAP
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    volumes:
      - aierp-test-jobs:/test-jobs
    restart: unless-stopped

volumes:
  aierp-sql-data:
  aierp-workspaces:
  aierp-test-jobs:
  aierp-release-packages:
  aierp-staging-releases:
  aierp-production-releases:
  aierp-production-backups:
    name: aierp-production-backups
  aierp-module-packages:
    name: aierp-module-packages
  aierp-deployer-state:
  aierp-prometheus-data:
  caddy-data:
  caddy-config:

networks:
  default: {}
  studio-internal:
  public-ingress: {}
  offsite-egress: {}
  monitoring:
    internal: true
  plugin-runtime:
    internal: true
  integration-runtime:
    internal: true
  integration-egress: {}
  monitoring-ui: {}
