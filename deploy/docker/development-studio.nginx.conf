server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker service IPs change when API/AI containers are recreated. Resolve
    # service names at request time so this long-lived proxy does not keep a
    # stale address until its own next deployment.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $platform_api platform-api:8080;
    set $ai_service ai-service:8080;

    # Revalidate the app shell so deployments pick up newly fingerprinted bundles.
    location = /index.html {
        expires -1;
    }

    # Vite writes fingerprinted production assets below /assets/.
    location ^~ /assets/ {
        expires 1y;
    }

    location /api/ {
        proxy_pass http://$platform_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /studio/ {
        proxy_pass http://$ai_service;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 135s;
        proxy_send_timeout 135s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://$platform_api/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
