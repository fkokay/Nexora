services:
  workspace-runner:
    build:
      context: ../..
      dockerfile: deploy/docker/WorkspaceRunner.Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      Authentication__SigningKey: ${CACHE_SMOKE_AUTH_SIGNING_KEY:?The smoke script must generate a one-run signing key}
      Authentication__Issuer: AIERP
      Authentication__Audience: AIERP.WorkspaceRunner
      Workspace__RootPath: /workspaces
      Workspace__AllowedGitHosts__0: github.com
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /home/app:rw,noexec,nosuid,size=16m,uid=1654,gid=1654,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    volumes:
      - workspaces:/workspaces
      - test-jobs:/test-jobs
      - release-packages:/release-packages
    networks:
      - smoke-internal
    depends_on:
      test-jobs-init:
        condition: service_completed_successfully
    restart: "no"

  test-jobs-init:
    image: busybox:1.37.0
    command: ["sh", "-c", "if [ \"$(stat -c %u /test-jobs)\" != 1654 ]; then chown -R 1654:1654 /test-jobs; fi && chmod 0770 /test-jobs"]
    volumes:
      - test-jobs:/test-jobs
    network_mode: none
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    pids_limit: 16
    mem_limit: 64m
    restart: "no"

  workspace-sandbox:
    build:
      context: ../..
      dockerfile: deploy/docker/WorkspaceSandbox.Dockerfile
    user: "1654:1654"
    environment:
      WorkspaceSandbox__JobRoot: /test-jobs
      WorkspaceSandbox__TempRoot: /tmp/test-jobs
      WorkspaceSandbox__PackageCacheRoot: /package-cache
      WorkspaceSandbox__MaxDependencyCacheBytes: "536870912"
    depends_on:
      workspace-runner:
        condition: service_healthy
      test-jobs-init:
        condition: service_completed_successfully
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp/test-jobs:rw,exec,nosuid,nodev,size=2g,uid=1654,gid=1654,mode=0711
    cap_drop: [ALL]
    cap_add: [KILL, SETPCAP, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    volumes:
      - test-jobs:/test-jobs
      - type: bind
        source: ${WORKSPACE_SANDBOX_PACKAGE_CACHE_PATH:?The smoke script must provide a unique cache directory}
        target: /package-cache
        read_only: true
        bind:
          create_host_path: false
    restart: "no"

volumes:
  workspaces:
  test-jobs:
  release-packages:

networks:
  smoke-internal:
    internal: true
