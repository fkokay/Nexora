name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # .NET tests are sharded to shorten feedback time. Every test runs exactly once:
  #   unit          -> tests/UnitTests project (all tests)
  #   integration-1..4 -> explicit class lists from tests/IntegrationTests/ci-shards.json
  #                   (greedy-balanced by measured per-class duration)
  #   integration-5 -> the COMPLEMENT of shards 1-4 (`!~` terms joined with `&`), so new or
  #                   unlisted test classes can never be missed.
  # To rebalance, edit ci-shards.json only.
  dotnet-tests:
    name: .NET tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: unit
            project: tests/UnitTests/AIERP.Platform.UnitTests
            index: ""
          - shard: integration-1
            project: tests/IntegrationTests
            index: "0"
          - shard: integration-2
            project: tests/IntegrationTests
            index: "1"
          - shard: integration-3
            project: tests/IntegrationTests
            index: "2"
          - shard: integration-4
            project: tests/IntegrationTests
            index: "3"
          - shard: integration-5
            project: tests/IntegrationTests
            index: "rest"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.0.0
        with:
          dotnet-version: 10.0.402
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build test filter
        id: filter
        env:
          SHARD_INDEX: ${{ matrix.index }}
        run: |
          f=""
          if [ "$SHARD_INDEX" = "rest" ]; then
            f=$(jq -r '[.shards[][] | "FullyQualifiedName!~\(.)."] | join("&")' tests/IntegrationTests/ci-shards.json)
          elif [ -n "$SHARD_INDEX" ]; then
            f=$(jq -r --argjson i "$SHARD_INDEX" '[.shards[$i][] | "FullyQualifiedName~\(.)."] | join("|")' tests/IntegrationTests/ci-shards.json)
          fi
          echo "filter length: ${#f}"
          echo "filter=$f" >> "$GITHUB_OUTPUT"
      - name: Test shard
        env:
          TEST_PROJECT: ${{ matrix.project }}
          TEST_FILTER: ${{ steps.filter.outputs.filter }}
        run: |
          args=(test "$TEST_PROJECT" --configuration Release --verbosity minimal -m:1 --logger "trx;LogFileName=r.trx" --results-directory "$RUNNER_TEMP/trx")
          if [ -n "$TEST_FILTER" ]; then args+=(--filter "$TEST_FILTER"); fi
          dotnet "${args[@]}"
      - name: Upload trx
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trx-${{ matrix.shard }}
          path: ${{ runner.temp }}/trx/*.trx
          retention-days: 3

  # Summary check that keeps the historical ".NET tests" name: succeeds only if all shards succeeded.
  dotnet-test:
    name: .NET tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: dotnet-tests
    if: ${{ always() }}
    steps:
      - name: Require all shards to pass
        env:
          RESULT: ${{ needs.dotnet-tests.result }}
        run: |
          echo "Shard result: $RESULT"
          test "$RESULT" = "success"

  frontend-build:
    name: Frontend build (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: erp-web
            path: frontend/erp-web
          - app: development-studio
            path: frontend/development-studio
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
      - name: Unit tests
        if: matrix.app == 'erp-web'
        run: npm test
